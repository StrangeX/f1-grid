apiVersion: batch/v1
kind: CronJob
metadata:
  name: f1-grid-refresh
  namespace: f1-grid
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: refresh
              image: curlimages/curl:8.11.1
              args:
                - -fsS
                - http://f1-grid:8080/api/refresh
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
