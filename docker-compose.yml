services:
  f1-grid:
    build: .
    image: f1-grid:local
    ports:
      - "8080:8080"
    environment:
      F1_SEASON: current
      F1_CACHE_TTL: "300"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
