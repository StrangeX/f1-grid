services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  f1-grid:
    build: .
    image: f1-grid:local
    ports:
      - "8080:8080"
    environment:
      F1_SEASON: current
      F1_CACHE_TTL: "21600"
      F1_SIMS: "4000"
      F1_POLL_IDLE_SEC: "1800"
      F1_POLL_RACE_SEC: "600"
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
